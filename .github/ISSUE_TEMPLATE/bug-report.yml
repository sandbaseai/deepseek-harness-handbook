name: Handbook bug report
description: Report an incorrect command, claim, link, diagram, or translation
title: "fix: "
labels:
  - bug
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link the handbook page containing the problem.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect?
      description: Quote the smallest relevant fragment and explain the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected correction
      description: Describe the correct behavior, command, or wording.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence
      description: Link an official source or provide reproducible steps and the DeepSeek Harness revision.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Verification boundary
      description: State what you observed directly and what remains unverified. Include the DSH package or source commit, OS, Node version, interface, and first error when relevant.
      placeholder: Reproduced on @deepseek-ai/dsh 0.x, Windows 11, Node 24, Web profile. I did not test headless or another provider.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, tokens, signed URLs, private paths, unrelated prompts, and credential values from this report.
          required: true
