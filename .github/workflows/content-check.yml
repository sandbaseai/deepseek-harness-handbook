name: Content check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run check:resources
      - run: npm run check:links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
