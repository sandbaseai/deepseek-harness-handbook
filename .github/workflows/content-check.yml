name: Content check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # DSH 0.2.2-alpha.3 declares Node >=24.9.0, so check content on Node 24.
          node-version: 24
      - run: npm run check
      - run: npm run check:resources
      - run: npm run check:links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
